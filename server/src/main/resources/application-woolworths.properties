# Woolworths-only profile: a separate database that is scraped from Woolworths alone.
#   ./mvnw spring-boot:run "-Dspring-boot.run.profiles=woolworths"
# Without the profile the app keeps using h2ProductData and the full scrape_targets.json.
# The first run on an empty h2Woolworths database scrapes straight away (takes a few minutes).
spring.datasource.url=jdbc:h2:file:./h2Woolworths
grocerfy.scrape-targets=classpath:scrape_targets_woolworths.json
