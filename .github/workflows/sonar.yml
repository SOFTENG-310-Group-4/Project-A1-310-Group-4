name: 'Sonar'
on:
  workflow_run:
    workflows: [ Build ]
    types:
      - completed
jobs:
  sonar:
    name: 'Sonar analysis'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: 'Sonar analysis'
        uses: SOFTENG-310-Group-4/Project-A1-310-Group-4/.github/actions@main
        with:
          distribution: "zulu"
          java-version: '17'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          project-key: SOFTENG-310-Group-4_Project-A1-310-Group-4